name: Operator CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'config/**'
      - 'README.md'

env:
  REGISTRY: docker.io
  IMAGE_NAME: kamasalyamov/livellm-proxy
  CHART_REPO: qalby-tech/livellm-proxy-chart

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:operator-v${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:operator-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-chart:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Checkout chart repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CHART_REPO }}
          token: ${{ secrets.CHART_REPO_TOKEN }}
          path: chart-repo

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Chart.yaml
        id: update-chart
        working-directory: chart-repo
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          
          # Update operator version in Chart.yaml annotations
          yq -i ".annotations.operatorVersion = \"$VERSION\"" Chart.yaml
          
          # We should NOT put the tag in values.yaml anymore, as the user wants it to be driven by Chart.yaml
          # But we still need to ensure the repository is correct in values.yaml?
          # The user's values.yaml has:
          # image:
          #   repository: kamasalyamov/livellm-proxy
          #   tag: ""
          # This looks correct. We can just ensure repository is correct if we want.
          
          yq -i ".operator.image.repository = \"${{ env.IMAGE_NAME }}\"" values.yaml
          
          # Optionally clear the tag in values.yaml to ensure defaults take over
          # yq -i ".operator.image.tag = \"\"" values.yaml
          
          echo "Updated Chart.yaml:"
          cat Chart.yaml
      
      - name: Commit and push changes
        working-directory: chart-repo
        run: |
          git config user.name "github-actions"
          git config user.email "kamasalyamov@gmail.com"
          git add Chart.yaml values.yaml
          git commit -m "chore(chart): update operator version to $VERSION" || echo "No changes to commit"
          git push origin main
