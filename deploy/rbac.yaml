apiVersion: v1
kind: ServiceAccount
metadata:
  name: livellm-proxy-operator
  namespace: livellm-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: livellm-proxy-operator
rules:
  # LLMProvider CRD access
  - apiGroups: ["proxy.livellm.ai"]
    resources: ["llmproviders"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["proxy.livellm.ai"]
    resources: ["llmproviders/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["proxy.livellm.ai"]
    resources: ["llmproviders/finalizers"]
    verbs: ["update"]

  # Secret read access (for API key references)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: livellm-proxy-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: livellm-proxy-operator
subjects:
  - kind: ServiceAccount
    name: livellm-proxy-operator
    namespace: livellm-system